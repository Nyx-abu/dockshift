name: Release

# Builds the Windows installer and publishes it to a GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-pty needs native compilation; windows-latest already ships with
      # the MSVC build tools and Python that node-gyp requires.
      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      # Detect pre-release from the tag name. Anything with a hyphen suffix
      # (e.g. `v0.9.0-rc.1`, `v1.0.0-beta.3`) goes out as Pre-release; clean
      # `vX.Y.Z` tags go out as the public Latest release. No more drafts.
      - name: Detect release type
        id: rel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "type=prerelease" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build and publish installer
        run: npx electron-builder --win --publish always --config.publish.releaseType=${{ steps.rel.outputs.type }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder uploads the installer but leaves the release body
      # empty. Ask GitHub to auto-generate notes from commits/PRs between the
      # previous tag and this one. Runs after the artifact upload so the
      # release definitely exists.
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --generate-notes
